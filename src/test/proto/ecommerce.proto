syntax = "proto3";
package com.example.proto;
option java_package = "com.example.proto.generated";
option java_outer_classname = "EcommerceOuterClass";
option java_generic_services = true;

message Product {
  string id = 1;
  string name = 2;
  double price = 3;
  Category category = 4;

  enum Category {
    ELECTRONICS = 0;
    CLOTHING = 1;
    HOME = 2;
    BOOKS = 3;
  }
}

message Order {
  string order_id = 1;
  map<string, int32> items = 2; // productId -> quantity
  float total_amount = 3;
  Status status = 4;

  enum Status {
    PENDING = 0;
    SHIPPED = 1;
    DELIVERED = 2;
    CANCELLED = 3;
  }
}

message GetProductRequest {
  string product_id = 1;
}

message PlaceOrderRequest {
  Order order = 1;
}

message PlaceOrderResponse {
  string order_id = 1;
  bool success = 2;
}

message UpdateInventoryRequest {
  string product_id = 1;
  int32 quantity_delta = 2;
}

message UpdateInventoryResponse {
  bool success = 1;
}

message TrackOrderRequest {
  string order_id = 1;
}

message TrackOrderResponse {
  Order.Status status = 1;
}

service ProductService {
  rpc GetProduct(GetProductRequest) returns (Product);
}

service OrderService {
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
}

service InventoryService {
  rpc UpdateInventory(UpdateInventoryRequest) returns (UpdateInventoryResponse);
}

service ShippingService {
  rpc TrackOrder(TrackOrderRequest) returns (TrackOrderResponse);
}
