syntax = "proto3";
package com.example.proto;
option java_package = "com.example.proto.generated";
option java_outer_classname = "Addressbook";
option java_generic_services = true;

message AddressBook {
  message Person {
    string name = 1;
    int32 id = 2;
    string email = 3;

    enum PhoneType {
      MOBILE = 0;
      HOME = 1;
      WORK = 2;
    }

    message PhoneNumber {
      string number = 1;
      PhoneType type = 2;
    }

    repeated PhoneNumber phones = 4;
  }

  repeated Person people = 1;
}

message GetAddressBookRequest {
  string id = 1;
}

service AddressBookService {
  rpc GetAddressBook(GetAddressBookRequest) returns (AddressBook);
}