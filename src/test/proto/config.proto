syntax = "proto3";
package com.example.proto;
option java_package = "com.example.proto.generated";

message AppConfig {
  string environment = 1;
  
  message Database {
    string host = 1;
    int32 port = 2;
    map<string, string> options = 3;
  }
  
  Database db = 2;
  
  message Logging {
    Level level = 1;
    enum Level {
      INFO = 0;
      DEBUG = 1;
      WARN = 2;
      ERROR = 3;
    }
    string output_path = 2;
  }
  
  Logging logging = 3;
  map<string, string> features = 4;
}
