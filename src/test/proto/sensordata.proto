syntax = "proto3";
package com.example.proto;
option java_package = "com.example.proto.generated";
option java_outer_classname = "SensordataOuterClass";

message SensorReading {
  string sensor_id = 1;
  int64 timestamp = 2;
  
  oneof value {
    double temperature = 3;
    double humidity = 4;
    bool status = 5;
    string error_message = 6;
  }
}

message BatchSensorReading {
  repeated SensorReading readings = 1;
}
